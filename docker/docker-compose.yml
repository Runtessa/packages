services:
  nginx:
    image: nginx:latest
    restart: unless-stopped
    depends_on:
      - auth
      - ide
      - core
    ports:
      - "${PORT_NGINX_HTTP:-80}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

  postgres:
    image: postgres:latest
    restart: unless-stopped
    env_file:
      - ./env/postgres.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro

  redis:
    image: redis:latest
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  auth:
    image: ${AUTH_IMAGE}
    restart: unless-stopped
    env_file:
      - ./env/auth.env
    depends_on:
      - postgres
    ports:
      - "${PORT_AUTH}:3015"

  core:
    image: ${CORE_IMAGE}
    restart: unless-stopped
    env_file:
      - ./env/core.env
    depends_on:
      - postgres
      - redis
      - auth
      - monitoring
      - container-agent
    ports:
      - "${PORT_CORE}:3005"
    extra_hosts:
      - "auth.localtest.me:host-gateway"

  ide:
    image: ${IDE_IMAGE}
    restart: unless-stopped
    env_file:
      - ./env/ide.env
    environment:
      AGENT_CODEX_GATEWAY_IMAGE: ${CODEX_GATEWAY_IMAGE}
    depends_on:
      - postgres
      - redis
      - core
      - auth
      - monitoring
      - container-agent
      - codex-gateway
    ports:
      - "${PORT_IDE}:3000"

  kernel:
    image: ${KERNEL_IMAGE}
    restart: unless-stopped
    ports:
      - "${PORT_KERNEL}:80"

  monitoring:
    image: ${MONITORING_IMAGE}
    restart: unless-stopped
    env_file:
      - ./env/monitoring.env
    depends_on:
      - redis
    ports:
      - "${PORT_MONITORING}:3011"

  codex-gateway:
    image: ${CODEX_GATEWAY_IMAGE}
    restart: unless-stopped
    env_file:
      - ./env/codex-gateway.env
    ports:
      - "${PORT_CODEX_GATEWAY}:4040"
    volumes:
      - codex_data:/data
      - ..:/workspace

  container-agent:
    image: ${CONTAINER_AGENT_IMAGE}
    restart: unless-stopped
    env_file:
      - ./env/container-agent.env
    environment:
      CONTAINER_MANAGER_CODEX_IMAGE: ${CODEX_GATEWAY_IMAGE}
      CONTAINER_MANAGER_MONITORING_IMAGE: ${MONITORING_IMAGE}
    depends_on:
      - redis
      - monitoring
      - codex-gateway
    ports:
      - "${PORT_CONTAINER_AGENT}:4070"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/srv/idp

volumes:
  postgres_data:
  redis_data:
  codex_data:

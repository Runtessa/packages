services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - auth
      - ide
      - core
    ports:
      - "${PORT_NGINX_HTTP:-80}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

  postgres:
    image: postgres:latest
    container_name: postgres
    restart: unless-stopped
    env_file:
      - ./env/postgres.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  auth:
    image: ${AUTH_IMAGE}
    container_name: auth
    restart: unless-stopped
    env_file:
      - ./env/auth.env
    depends_on:
      - postgres
    ports:
      - "${PORT_AUTH}:3015"

  core:
    image: ${CORE_IMAGE}
    container_name: core
    restart: unless-stopped
    env_file:
      - ./env/core.env
    depends_on:
      - postgres
      - redis
      - auth
      - container-agent
    ports:
      - "${PORT_CORE}:3005"

  ide:
    image: ${IDE_IMAGE}
    container_name: ide
    restart: unless-stopped
    env_file:
      - ./env/ide.env
    environment:
      AGENT_CODEX_GATEWAY_IMAGE: ${CODEX_GATEWAY_IMAGE}
    depends_on:
      - postgres
      - redis
      - core
      - auth
      - container-agent
    ports:
      - "${PORT_IDE}:3000"

  container-agent:
    image: ${CONTAINER_AGENT_IMAGE}
    container_name: container-agent
    restart: unless-stopped
    env_file:
      - ./env/container-agent.env
    environment:
      CONTAINER_MANAGER_CODEX_IMAGE: ${CODEX_GATEWAY_IMAGE}
      CONTAINER_MANAGER_MONITORING_IMAGE: ${MONITORING_IMAGE}
    depends_on:
      - redis
    ports:
      - "${PORT_CONTAINER_AGENT}:4070"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/srv/idp

volumes:
  postgres_data:
  redis_data:

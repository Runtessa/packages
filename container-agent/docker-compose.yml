version: "3.9"

services:
  idp-container-manager:
    container_name: idp-container-manager
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${CONTAINER_MANAGER_BIND_PORT:-4070}:${CONTAINER_MANAGER_PORT:-4070}"
    volumes:
      - "${CONTAINER_MANAGER_SOCKET_HOST_PATH:-/var/run/docker.sock}:${CONTAINER_MANAGER_SOCKET:-/var/run/docker.sock}"
      - "${CONTAINER_MANAGER_WORKSPACE_HOST_PATH:-..}:${CONTAINER_MANAGER_WORKSPACE_MOUNT_PATH:-/srv/idp}"

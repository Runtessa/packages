<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kernel Preview</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #ffffff;
        color: #111827;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      #root {
        min-height: 100%;
      }
      #status {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: #4b5563;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="status">Preparing preview...</div>
    <script src="/bundle.js"></script>
    <script>
      (function () {
        var statusEl = document.getElementById("status");
        var params = new URLSearchParams(window.location.search);
        var name = params.get("name");
        var version = params.get("version") || "latest";
        var tenantHost = params.get("tenantHost") || "";
        var previewSession = params.get("previewSession") || "";
        var registryUrl = params.get("registryUrl") || "/api/registry";
        window.__IDP_TENANT_HOST__ = tenantHost;
        window.__IDP_PREVIEW__ = true;

        var toText = function (value) {
          if (value == null) return "";
          if (typeof value === "string") return value;
          if (typeof value === "number" || typeof value === "boolean") {
            return String(value);
          }
          if (value instanceof Error) {
            return value.message || String(value);
          }
          try {
            return JSON.stringify(value);
          } catch (error) {
            return String(value);
          }
        };

        var sendPreviewException = function (payload) {
          try {
            if (!window.parent || window.parent === window) return;
            window.parent.postMessage(
              {
                source: "idp-preview-exception",
                payload: Object.assign(
                  {
                    createdAt: new Date().toISOString(),
                    previewName: name || "",
                    previewVersion: version || "",
                    previewSession: previewSession || "",
                    tenantHost: tenantHost || "",
                    href: window.location.href,
                  },
                  payload || {}
                ),
              },
              "*"
            );
          } catch (error) {
            // no-op
          }
        };

        window.addEventListener("error", function (event) {
          sendPreviewException({
            kind: "runtime-error",
            level: "error",
            message: toText(event && event.message ? event.message : "Runtime error"),
            stack:
              event && event.error && event.error.stack
                ? toText(event.error.stack)
                : "",
            sourceUrl: event && event.filename ? String(event.filename) : "",
            line: event && typeof event.lineno === "number" ? event.lineno : null,
            column: event && typeof event.colno === "number" ? event.colno : null,
          });
        });

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event ? event.reason : null;
          var message =
            reason && typeof reason === "object" && reason.message
              ? toText(reason.message)
              : toText(reason || "Unhandled promise rejection");
          sendPreviewException({
            kind: "unhandled-rejection",
            level: "error",
            message: message || "Unhandled promise rejection",
            stack:
              reason && typeof reason === "object" && reason.stack
                ? toText(reason.stack)
                : "",
          });
        });

        if (window.console && typeof window.console.error === "function") {
          var originalConsoleError = window.console.error.bind(window.console);
          window.console.error = function () {
            var args = Array.prototype.slice.call(arguments || []);
            sendPreviewException({
              kind: "console-error",
              level: "error",
              message:
                args
                  .map(function (arg) {
                    return toText(arg);
                  })
                  .join(" ")
                  .trim() || "console.error",
            });
            return originalConsoleError.apply(window.console, args);
          };
        }

        if (!name) {
          statusEl.textContent = "No preview target selected.";
          return;
        }

        if (window.fetch) {
          var originalFetch = window.fetch.bind(window);
          window.fetch = function (input, init) {
            var nextInit = init || {};
            var headers = new Headers(nextInit.headers || {});
            if (tenantHost) {
              headers.set("X-Tenant-Host", tenantHost);
            }
            headers.set("X-Dev-Preview", "true");
            nextInit.headers = headers;
            var requestUrl = "";
            try {
              if (typeof input === "string") {
                requestUrl = input;
              } else if (input && typeof input.url === "string") {
                requestUrl = input.url;
              }
            } catch (error) {
              requestUrl = "";
            }
            var requestMethod = String(nextInit.method || "GET").toUpperCase();
            return originalFetch(input, nextInit)
              .then(function (response) {
                if (!response || response.ok) return response;
                var report = {
                  kind: "http-error",
                  level: "error",
                  message:
                    "HTTP " +
                    String(response.status) +
                    " " +
                    String(response.statusText || ""),
                  requestUrl: requestUrl,
                  method: requestMethod,
                  status: response.status,
                };
                try {
                  var clone = response.clone();
                  clone
                    .text()
                    .then(function (text) {
                      sendPreviewException(
                        Object.assign({}, report, {
                          responseSnippet: String(text || "").slice(0, 2000),
                        })
                      );
                    })
                    .catch(function () {
                      sendPreviewException(report);
                    });
                } catch (error) {
                  sendPreviewException(report);
                }
                return response;
              })
              .catch(function (error) {
                sendPreviewException({
                  kind: "network-error",
                  level: "error",
                  message:
                    (error && error.message) || "Network request failed in preview.",
                  stack: error && error.stack ? String(error.stack) : "",
                  requestUrl: requestUrl,
                  method: requestMethod,
                });
                throw error;
              });
          };
        }

        if (!window.Kernel) {
          statusEl.textContent = "Kernel bundle failed to load.";
          sendPreviewException({
            kind: "kernel-load-error",
            level: "error",
            message: "Kernel bundle failed to load.",
          });
          return;
        }

        statusEl.textContent = "Loading preview...";
        var kernel = new window.Kernel({ registryUrl: registryUrl });
        kernel
          .boot(name, "root", version)
          .then(function () {
            if (statusEl) {
              statusEl.remove();
            }
          })
          .catch(function (error) {
            statusEl.textContent =
              (error && error.message) || "Failed to load preview.";
            sendPreviewException({
              kind: "preview-boot-error",
              level: "error",
              message: (error && error.message) || "Failed to load preview.",
              stack: error && error.stack ? String(error.stack) : "",
            });
          });
      })();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kernel Preview</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #ffffff;
        color: #111827;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      #root {
        min-height: 100%;
      }
      #status {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: #4b5563;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="status">Preparing preview...</div>
    <script src="/bundle.js"></script>
    <script>
      (function () {
        var statusEl = document.getElementById("status");
        var params = new URLSearchParams(window.location.search);
        var name = params.get("name");
        var version = params.get("version") || "latest";
        var tenantHost = params.get("tenantHost") || "";
        var registryUrl = params.get("registryUrl") || "/api/registry";

        if (!name) {
          statusEl.textContent = "No preview target selected.";
          return;
        }

        if (tenantHost) {
          var originalFetch = window.fetch.bind(window);
          window.fetch = function (input, init) {
            var nextInit = init || {};
            var headers = new Headers(nextInit.headers || {});
            headers.set("X-Tenant-Host", tenantHost);
            nextInit.headers = headers;
            return originalFetch(input, nextInit);
          };
        }

        if (!window.Kernel) {
          statusEl.textContent = "Kernel bundle failed to load.";
          return;
        }

        statusEl.textContent = "Loading preview...";
        var kernel = new window.Kernel({ registryUrl: registryUrl });
        kernel
          .boot(name, "root", version)
          .then(function () {
            if (statusEl) {
              statusEl.remove();
            }
          })
          .catch(function (error) {
            statusEl.textContent =
              (error && error.message) || "Failed to load preview.";
          });
      })();
    </script>
  </body>
</html>

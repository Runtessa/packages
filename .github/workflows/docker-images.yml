name: Docker Images

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    name: Build ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: core
            context: .
            dockerfile: src/core/Dockerfile
          - name: auth
            context: src/auth
            dockerfile: src/auth/Dockerfile
          - name: ide
            context: src/ideNew
            dockerfile: src/ideNew/Dockerfile
          - name: kernel
            context: .
            dockerfile: src/kernel/Dockerfile
          - name: monitoring
            context: src/monitoring
            dockerfile: src/monitoring/Dockerfile
          - name: container-agent
            context: src/container-agent
            dockerfile: src/container-agent/Dockerfile
          - name: codex-gateway
            context: src/codex-gateway
            dockerfile: src/codex-gateway/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/idpcore-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
